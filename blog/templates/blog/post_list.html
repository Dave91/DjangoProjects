{% extends 'blog/base.html' %} {% block content %} {% for post in posts %}
<div class="post" style="height: 250px; overflow-y: hidden">
  <div class="date">{{ post.published_date }}</div>
  <h2><a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a></h2>
  <a href="{% url 'post_detail' pk=post.pk %}"
    >Comments: {{ post.comments.count }}</a
  >
  <a href="{% url 'post_detail' pk=post.pk %}">Likes: {{ post.likes }}</a>
  <p style="text-align: justify">{{ post.text|linebreaksbr }}</p>
</div>
{% endfor %} {% endblock content %}
